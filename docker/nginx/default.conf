server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    # Laravelのpublicをドキュメントルートに
    root /var/www/html/src/public;
    index index.php index.html;

    # 2. 静的アセットは直接返却
    location ~* \.(?:css|js|map|png|jpe?g|gif|webp|svg|ico|ttf|woff2?|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Laravel APIを使う例
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHPの実行設定 (php-fpm)
    location ~ \.php$ {
        fastcgi_pass   laravel:9000;  # laravelコンテナのサービス名:ポート
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
